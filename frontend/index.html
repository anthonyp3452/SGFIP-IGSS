<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://sgfip-igss.onrender.com http://localhost:3000; frame-src 'none'; object-src 'none'; base-uri 'self';" />
  <title>SGFIP | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #0f1729;
      --primary-light: #1e3a5f;
      --primary-mid: #2d5f8a;
      --accent: #C8A84E;
      --accent-light: #dfc066;
      --white: #FFFFFF;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-400: #94a3b8;
      --gray-600: #64748b;
      --gray-900: #0f1729;
      --error-bg: #fef2f2;
      --error-text: #dc2626;
      --error-border: #fca5a5;
      --success: #16a34a;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
      --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
      --shadow-2xl: 0 25px 50px -12px rgba(0,0,0,0.25);
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: linear-gradient(-45deg, #0f1729, #1e3a5f, #0f1729, #162d50);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      color: var(--gray-900);
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(200, 168, 78, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(45, 95, 138, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 40% 80%, rgba(200, 168, 78, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 44px 36px 36px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.15),
        var(--shadow-2xl);
      animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .login-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 50%);
      pointer-events: none;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 4px;
      position: relative;
    }

    .login-logo img {
      width: 88px;
      height: 88px;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      background: var(--white);
      padding: 4px;
      animation: float 6s ease-in-out infinite;
    }

    .login-title {
      text-align: center;
      margin: 12px 0 2px;
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .login-title span {
      color: var(--accent);
    }

    .login-subtitle {
      text-align: center;
      margin: 0 0 32px;
      font-size: 13px;
      color: var(--gray-600);
      line-height: 1.5;
      font-weight: 400;
    }

    .field-group {
      margin-bottom: 20px;
      position: relative;
    }

    .floating-label {
      position: relative;
    }

    .floating-label input {
      width: 100%;
      border: 1.5px solid var(--gray-200);
      border-radius: 12px;
      padding: 18px 14px 6px;
      font-size: 14px;
      color: var(--gray-900);
      outline: none;
      background: var(--gray-50);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      font-family: inherit;
      height: 54px;
    }

    .floating-label input:focus {
      border-color: var(--primary-mid);
      box-shadow: 0 0 0 4px rgba(45, 95, 138, 0.1);
      background: var(--white);
    }

    .floating-label input.valid {
      border-color: var(--success);
    }

    .floating-label label {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      font-weight: 500;
      color: var(--gray-400);
      pointer-events: none;
      transition: all 0.2s ease;
      background: transparent;
      padding: 0 2px;
      line-height: 1;
    }

    .floating-label input:focus ~ label,
    .floating-label input:not(:placeholder-shown) ~ label {
      top: 10px;
      transform: translateY(0);
      font-size: 11px;
      font-weight: 600;
      color: var(--primary-mid);
    }

    .floating-label input:focus.valid ~ label {
      color: var(--success);
    }

    .floating-label input::placeholder {
      color: transparent;
    }

    .floating-label input:focus::placeholder {
      color: var(--gray-400);
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--gray-400);
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      transition: color 0.2s ease, background 0.2s ease;
      z-index: 2;
    }

    .toggle-password:hover {
      color: var(--primary-mid);
      background: rgba(45, 95, 138, 0.06);
    }

    .field-error {
      display: none;
      margin-top: 6px;
      padding: 8px 10px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 8px;
      color: var(--error-text);
      font-size: 12px;
      line-height: 1.4;
    }

    .row-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0 24px;
    }

    .toggle-switch {
      display: flex;
      align-items: center;
      gap: 10px;
      user-select: none;
      cursor: pointer;
      font-size: 13px;
      color: var(--gray-600);
    }

    .toggle-switch input {
      display: none;
    }

    .toggle-track {
      width: 40px;
      height: 22px;
      background: var(--gray-200);
      border-radius: 12px;
      position: relative;
      transition: background 0.25s ease;
      flex-shrink: 0;
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      background: var(--white);
      border-radius: 50%;
      transition: transform 0.25s ease;
      box-shadow: var(--shadow-sm);
    }

    .toggle-switch input:checked + .toggle-track {
      background: var(--primary-mid);
    }

    .toggle-switch input:checked + .toggle-track::after {
      transform: translateX(18px);
    }

    .toggle-switch:hover .toggle-track {
      background: var(--gray-400);
    }

    .toggle-switch:hover input:checked + .toggle-track {
      background: var(--primary-light);
    }

    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: var(--white);
      font-size: 15px;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px rgba(15, 23, 41, 0.3);
      font-family: inherit;
      position: relative;
      overflow: hidden;
    }

    .submit-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-mid) 100%);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .submit-btn:hover:not(:disabled)::before {
      opacity: 1;
    }

    .submit-btn:hover:not(:disabled) {
      box-shadow: 0 6px 20px rgba(15, 23, 41, 0.4);
      transform: translateY(-2px);
    }

    .submit-btn:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(15, 23, 41, 0.3);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .submit-btn .btn-text,
    .submit-btn .spinner {
      position: relative;
      z-index: 1;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .submit-btn.loading .spinner { display: inline-block; }
    .submit-btn.loading .btn-text { opacity: 0.9; }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--gray-400);
    }

    .login-footer a {
      color: var(--primary-mid);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .login-footer a:hover {
      color: var(--primary-light);
      text-decoration: underline;
    }

    .decorative-dots {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .decorative-dots span {
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(200, 168, 78, 0.15);
      border-radius: 50%;
    }

    .decorative-dots span:nth-child(1) { top: 15%; left: 10%; animation: float 8s ease-in-out infinite; }
    .decorative-dots span:nth-child(2) { top: 70%; left: 85%; width: 10px; height: 10px; animation: float 10s ease-in-out infinite 1s; background: rgba(45, 95, 138, 0.15); }
    .decorative-dots span:nth-child(3) { top: 85%; left: 20%; width: 8px; height: 8px; animation: float 7s ease-in-out infinite 2s; }
    .decorative-dots span:nth-child(4) { top: 25%; left: 80%; width: 4px; height: 4px; animation: float 9s ease-in-out infinite 0.5s; background: rgba(45, 95, 138, 0.2); }
    .decorative-dots span:nth-child(5) { top: 50%; left: 5%; width: 12px; height: 12px; animation: float 11s ease-in-out infinite 3s; background: rgba(200, 168, 78, 0.1); }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px 28px;
        border-radius: 20px;
      }

      .login-logo img {
        width: 72px;
        height: 72px;
      }

      .login-title {
        font-size: 20px;
      }

      .floating-label input {
        height: 50px;
        padding: 16px 12px 6px;
      }
    }

    .btn-creditos {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s, transform 0.25s;
      padding: 0;
    }
    .btn-creditos:hover {
      background: rgba(255,255,255,0.25);
      transform: scale(1.1);
    }
    .btn-creditos img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 0;
    }
    .modal-credits-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-credits-overlay.open {
      display: flex;
    }
    .modal-credits-box {
      background: var(--white);
      border-radius: 20px;
      padding: 36px 32px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-2xl);
      animation: fadeSlideUp 0.3s ease;
    }
    .modal-credits-box img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 16px;
    }
    .modal-credits-box h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      margin: 0 0 8px;
      line-height: 1.3;
    }
    .modal-credits-box p {
      font-size: 13px;
      color: var(--gray-600);
      line-height: 1.6;
      margin: 0 0 6px;
    }
    .modal-credits-box .credits-umg {
      font-weight: 600;
      color: var(--primary);
    }
    .btn-cerrar-creditos {
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: var(--gray-100);
      color: var(--gray-700);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 28px;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }
    .btn-cerrar-creditos:hover {
      background: var(--gray-200);
    }
  </style>
</head>
<body>
  <div class="decorative-dots">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="login-card">
    <div class="login-logo">
      <img src="images/logo.jpg" alt="IGSS" />
    </div>
    <h1 class="login-title">SGFIP<span>.</span></h1>
    <p class="login-subtitle">
      Delegación Retalhuleu<br />
      Sistema de Gestión de Flujo de Informes Patronales
    </p>

    <form id="loginForm" novalidate>
      <div class="field-group">
        <div class="floating-label">
          <input
            id="username"
            name="username"
            type="text"
            placeholder="ej: admin"
            autocomplete="username"
            required
          />
          <label for="username">Usuario</label>
        </div>
        <div class="field-error" id="usernameError"></div>
      </div>

      <div class="field-group">
        <div class="password-wrapper floating-label">
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
            required
          />
          <label for="password">Contraseña</label>
          <button class="toggle-password" type="button" id="togglePassword" aria-label="Mostrar u ocultar contraseña">
            Mostrar
          </button>
        </div>
        <div class="field-error" id="passwordError"></div>
      </div>

      <div class="row-actions">
        <label class="toggle-switch" for="remember">
          <input type="checkbox" id="remember" name="remember" />
          <span class="toggle-track"></span>
          <span>Recordar sesión</span>
        </label>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-text">Ingresar</span>
      </button>

      <div class="login-footer">
        ¿No tiene cuenta? <a href="register.html">Crear cuenta</a>
      </div>
    </form>
  </div>

  <script src="js/toast.js"></script>
  <script src="js/config.js"></script>
  <script>
    const loginForm = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const rememberInput = document.getElementById("remember");
    const usernameError = document.getElementById("usernameError");
    const passwordError = document.getElementById("passwordError");
    const submitBtn = document.getElementById("submitBtn");
    const togglePasswordBtn = document.getElementById("togglePassword");
    const CONFIG = SGFIP_CONFIG;

    const messages = {
      required: "El campo es obligatorio.",
      invalidUsername: "El usuario debe tener al menos 3 caracteres.",
      invalidCredentials: "Credenciales inválidas. Verifique los datos ingresados o contacte al administrador."
    };

    const clearFieldError = (input, errorBox) => {
      errorBox.style.display = "none";
      errorBox.textContent = "";
      input.classList.remove("valid");
    };

    const showFieldError = (input, errorBox, message) => {
      errorBox.style.display = "block";
      errorBox.textContent = message;
      input.classList.remove("valid");
    };

    const markValid = (input, errorBox) => {
      errorBox.style.display = "none";
      errorBox.textContent = "";
      input.classList.add("valid");
    };

    const validateUsernameField = () => {
      const username = usernameInput.value.trim();
      if (!username) {
        showFieldError(usernameInput, usernameError, messages.required);
        return false;
      }
      if (username.length < 3) {
        showFieldError(usernameInput, usernameError, messages.invalidUsername);
        return false;
      }
      markValid(usernameInput, usernameError);
      return true;
    };

    const validatePasswordField = () => {
      const password = passwordInput.value;
      if (!password) {
        showFieldError(passwordInput, passwordError, messages.required);
        return false;
      }
      markValid(passwordInput, passwordError);
      return true;
    };

    const setLoading = (isLoading) => {
      submitBtn.disabled = isLoading;
      submitBtn.classList.toggle("loading", isLoading);
      submitBtn.querySelector(".btn-text").textContent = isLoading ? "Validando..." : "Ingresar";
    };

    const normalizeApiResult = async (response) => {
      let payload = {};
      try {
        payload = await response.json();
      } catch (error) {
        payload = {};
      }

      if (response.ok) {
        return { ok: true, data: payload };
      }

      return { ok: false, reason: "invalidCredentials" };
    };

    const loginWithApi = async ({ username, password }) => {
      const loginUrl = `${CONFIG.apiBaseUrl}${CONFIG.apiLoginPath}`;
      try {
        const response = await fetch(loginUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        return normalizeApiResult(response);
      } catch {
        return { ok: false, reason: "network" };
      }
    };

    const saveSession = (data, remember) => {
      const storage = remember ? localStorage : sessionStorage;
      storage.setItem("sgfip_session", JSON.stringify(data));
    };

    const flattenSession = (data) => {
      const user = data.user || {};
      return {
        ...data,
        accessToken: data.accessToken || data.token,
        token: data.accessToken || data.token,
        userName: user.nombre || user.name || data.userName,
        username: user.username || data.username,
        role: user.rolId === 1 ? 'admin' : user.rolId === 2 ? 'inspector' : user.rolId === 3 ? 'supervisor' : data.role,
      };
    };

    const onAuthSuccess = (provider, data, remember) => {
      saveSession(
        {
          provider,
          loginAt: new Date().toISOString(),
          ...flattenSession(data),
        },
        remember
      );
      showToast("Sesión iniciada con éxito", "success", { duration: 2000 });
      setTimeout(() => {
        window.location.href = "app.html";
      }, 1600);
    };

    usernameInput.addEventListener("blur", validateUsernameField);
    passwordInput.addEventListener("blur", validatePasswordField);

    usernameInput.addEventListener("input", () => clearFieldError(usernameInput, usernameError));
    passwordInput.addEventListener("input", () => clearFieldError(passwordInput, passwordError));

    togglePasswordBtn.addEventListener("click", () => {
      const isHidden = passwordInput.type === "password";
      passwordInput.type = isHidden ? "text" : "password";
      togglePasswordBtn.textContent = isHidden ? "Ocultar" : "Mostrar";
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const usernameIsValid = validateUsernameField();
      const passwordIsValid = validatePasswordField();
      if (!usernameIsValid || !passwordIsValid) {
        showToast("Revise los datos ingresados en el formulario.", "warning");
        return;
      }

      setLoading(true);

      try {
        const result = await loginWithApi({
          username: usernameInput.value.trim(),
          password: passwordInput.value
        });

        if (!result.ok) {
          if (result.reason === "network") {
            showToast("Error al conectar con el servidor. Verifique su conexión e intente de nuevo.", "error");
          } else {
            showToast(messages.invalidCredentials, "error");
          }
          return;
        }

        onAuthSuccess("password", result.data || {}, rememberInput.checked);
      } catch (error) {
        showToast("Ocurrió un error inesperado al iniciar sesión.", "error");
      } finally {
        setLoading(false);
      }
    });

    window.addEventListener("load", () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get("logout") === "1") {
        showToast("Sesión cerrada correctamente", "info");
        const url = new URL(window.location.href);
        url.searchParams.delete("logout");
        history.replaceState(null, "", url.pathname + url.search || window.location.pathname);
      }
    });
  </script>

  <button class="btn-creditos" id="btnCreditos" title="Créditos">
    <img src="images/logo_U.png" alt="UMG" />
  </button>

  <div class="modal-credits-overlay" id="modalCreditos">
    <div class="modal-credits-box">
      <img src="images/logo_U.png" alt="UMG" />
      <h3>Software desarrollado por estudiantes de</h3>
      <p class="credits-umg">Ingeniería en Sistemas</p>
      <p>Universidad Mariano Gálvez de Guatemala</p>
      <p>Retalhuleu</p>
      <button class="btn-cerrar-creditos" id="btnCerrarCreditos">Cerrar</button>
    </div>
  </div>

  <script>
    document.getElementById("btnCreditos").addEventListener("click", () => {
      document.getElementById("modalCreditos").classList.add("open");
    });
    document.getElementById("btnCerrarCreditos").addEventListener("click", () => {
      document.getElementById("modalCreditos").classList.remove("open");
    });
    document.getElementById("modalCreditos").addEventListener("click", (e) => {
      if (e.target === e.currentTarget) {
        document.getElementById("modalCreditos").classList.remove("open");
      }
    });
  </script>
</body>
</html>
