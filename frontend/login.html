<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGFIP | Login</title>
  <style>
    :root {
      --celeste-institucional: #2DAAE1;
      --celeste-claro: #A7D8F5;
      --blanco: #FFFFFF;
      --gris-oscuro: #333333;
      --gris-claro: #E0E0E0;
      --error-bg: #ffe6ea;
      --error-border: #d93025;
      --success-border: #2e7d32;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(140deg, var(--celeste-institucional), var(--celeste-claro));
      color: var(--gris-oscuro);
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      background: var(--blanco);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.12);
    }

    .card-header {
      background: var(--celeste-institucional);
      color: var(--blanco);
      padding: 18px 20px;
    }

    .header-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.22);
      display: grid;
      place-items: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .institution {
      margin: 0;
      font-size: 13px;
      line-height: 1.3;
      opacity: 0.95;
    }

    .system-name {
      margin: 4px 0 0;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
    }

    .card-body {
      padding: 22px 20px 24px;
    }

    .field-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    .input-control {
      width: 100%;
      border: 1px solid var(--gris-claro);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      color: var(--gris-oscuro);
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .input-control:focus {
      border-color: var(--celeste-institucional);
      box-shadow: 0 0 0 3px rgba(45, 170, 225, 0.18);
    }

    .input-control.valid {
      border-color: var(--success-border);
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--celeste-institucional);
      font-weight: 600;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 12px;
    }

    .toggle-password:focus-visible {
      outline: 2px solid var(--celeste-claro);
      outline-offset: 1px;
    }

    .field-error {
      display: none;
      margin-top: 7px;
      padding: 8px 10px;
      background: var(--error-bg);
      border-left: 4px solid var(--error-border);
      border-radius: 7px;
      color: #7a1f18;
      font-size: 12.5px;
    }

    .row-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0 16px;
      font-size: 14px;
    }

    .remember-session {
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }

    .remember-session input {
      width: 16px;
      height: 16px;
      accent-color: var(--celeste-institucional);
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      background: var(--celeste-institucional);
      color: var(--blanco);
      font-size: 15px;
      font-weight: 700;
      padding: 12px 14px;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: filter 0.18s ease;
    }

    .submit-btn:hover:not(:disabled) {
      filter: brightness(0.96);
    }

    .submit-btn:disabled {
      opacity: 0.75;
      cursor: not-allowed;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-top-color: var(--blanco);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: none;
    }

    .submit-btn.loading .spinner {
      display: inline-block;
    }

    .submit-btn.loading .btn-text {
      opacity: 0.95;
    }

    .separator {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0 12px;
      color: #667085;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .separator::before,
    .separator::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--gris-claro);
    }

    .google-btn {
      width: 100%;
      border: 1px solid var(--gris-claro);
      border-radius: 10px;
      background: #fff;
      color: var(--gris-oscuro);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 12px;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .google-btn:hover:not(:disabled) {
      background: #f7f9fc;
      border-color: #c9d0d8;
    }

    .google-btn:disabled {
      opacity: 0.75;
      cursor: not-allowed;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <header class="card-header">
      <div class="header-row">
        <div class="logo" aria-hidden="true">🏛️</div>
        <div>
          <p class="institution">IGSS — Delegación Retalhuleu, área de Inspección Patronal</p>
          <h1 class="system-name">SGFIP | Sistema de Gestión de Flujo de Informes Patronales</h1>
        </div>
      </div>
    </header>

    <div class="card-body">
      <form id="loginForm" novalidate>
        <div class="field-group">
          <label for="email">Correo electrónico</label>
          <input
            class="input-control"
            id="email"
            name="email"
            type="email"
            placeholder="nombre@igss.gob.gt"
            autocomplete="username"
          />
          <div class="field-error" id="emailError"></div>
        </div>

        <div class="field-group">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input
              class="input-control"
              id="password"
              name="password"
              type="password"
              placeholder="Ingrese su contraseña"
              autocomplete="current-password"
            />
            <button class="toggle-password" type="button" id="togglePassword" aria-label="Mostrar u ocultar contraseña">
              Mostrar
            </button>
          </div>
          <div class="field-error" id="passwordError"></div>
        </div>

        <div class="row-actions">
          <label class="remember-session" for="remember">
            <input type="checkbox" id="remember" name="remember" />
            <span>Recordar sesión</span>
          </label>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-text">Ingresar</span>
        </button>

        <div class="separator">o</div>

        <button type="button" class="google-btn" id="googleBtn">
          <span aria-hidden="true">G</span>
          <span>Continuar con Google</span>
        </button>
      </form>
    </div>
  </div>

  <script src="js/toast.js"></script>
  <script>
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const rememberInput = document.getElementById("remember");
    const emailError = document.getElementById("emailError");
    const passwordError = document.getElementById("passwordError");
    const submitBtn = document.getElementById("submitBtn");
    const googleBtn = document.getElementById("googleBtn");
    const togglePasswordBtn = document.getElementById("togglePassword");
    const CONFIG = {
      apiBaseUrl: "http://localhost:3000",
      apiLoginPath: "/api/auth/login",
      googleAuthPath: "/api/auth/google"
    };

    const messages = {
      required: "El campo es obligatorio.",
      invalidEmail: "Formato de correo inválido. Ej: nombre@igss.gob.gt",
      userNotFound: "Usuario no encontrado. Verifique el correo electrónico ingresado.",
      wrongPassword: "Contraseña incorrecta. Intente nuevamente o contacte al administrador."
    };

    const emailRegex = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/;

    const clearFieldError = (input, errorBox) => {
      errorBox.style.display = "none";
      errorBox.textContent = "";
      input.classList.remove("valid");
    };

    const showFieldError = (input, errorBox, message) => {
      errorBox.style.display = "block";
      errorBox.textContent = message;
      input.classList.remove("valid");
    };

    const markValid = (input, errorBox) => {
      errorBox.style.display = "none";
      errorBox.textContent = "";
      input.classList.add("valid");
    };

    const validateEmailField = () => {
      const email = emailInput.value.trim();
      if (!email) {
        showFieldError(emailInput, emailError, messages.required);
        return false;
      }
      if (!emailRegex.test(email)) {
        showFieldError(emailInput, emailError, messages.invalidEmail);
        return false;
      }
      markValid(emailInput, emailError);
      return true;
    };

    const validatePasswordField = () => {
      const password = passwordInput.value;
      if (!password) {
        showFieldError(passwordInput, passwordError, messages.required);
        return false;
      }
      markValid(passwordInput, passwordError);
      return true;
    };

    const setLoading = (isLoading) => {
      submitBtn.disabled = isLoading;
      googleBtn.disabled = isLoading;
      submitBtn.classList.toggle("loading", isLoading);
      submitBtn.querySelector(".btn-text").textContent = isLoading ? "Validando..." : "Ingresar";
    };

    const normalizeApiResult = async (response) => {
      let payload = {};
      try {
        payload = await response.json();
      } catch (error) {
        payload = {};
      }

      if (response.ok) {
        return { ok: true, data: payload };
      }

      const backendCode = payload.code || payload.error;
      if (response.status === 404 || backendCode === "USER_NOT_FOUND") {
        return { ok: false, reason: "userNotFound" };
      }

      if (response.status === 401 || backendCode === "INVALID_PASSWORD") {
        return { ok: false, reason: "wrongPassword" };
      }

      return { ok: false, reason: "generic" };
    };

    const loginWithApi = async ({ email, password, remember }) => {
      const loginUrl = `${CONFIG.apiBaseUrl}${CONFIG.apiLoginPath}`;
      if (!CONFIG.apiBaseUrl.includes("TU_BACKEND")) {
        try {
          const response = await fetch(loginUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password, remember })
          });
          return normalizeApiResult(response);
        } catch {
          return { ok: false, reason: "network" };
        }
      }

      // Modo demo local mientras configuras el endpoint real.
      await new Promise((resolve) => setTimeout(resolve, 1200));
      if (email.toLowerCase() !== "admin@igss.gob.gt") return { ok: false, reason: "userNotFound" };
      if (password !== "IGSS2026!") return { ok: false, reason: "wrongPassword" };
      return {
        ok: true,
        data: {
          token: "demo-token",
          email,
          userName: "Administrador demo",
          role: "admin"
        }
      };
    };

    const saveSession = (data, remember) => {
      const storage = remember ? localStorage : sessionStorage;
      storage.setItem("sgfip_session", JSON.stringify(data));
    };

    const onAuthSuccess = (provider, data, remember) => {
      saveSession(
        {
          provider,
          loginAt: new Date().toISOString(),
          ...data
        },
        remember
      );
      showToast("Sesión iniciada con éxito", "success", { duration: 2000 });
      setTimeout(() => {
        window.location.href = "app.html";
      }, 1600);
    };

    const setupGoogleAuth = () => {
      if (!CONFIG.apiBaseUrl || !CONFIG.googleAuthPath) {
        googleBtn.disabled = true;
        googleBtn.title = "Configura apiBaseUrl y googleAuthPath para habilitar Google.";
        return;
      }

      googleBtn.addEventListener("click", () => {
        const remember = rememberInput.checked ? "1" : "0";
        const redirectUri = encodeURIComponent(window.location.href);
        const googleUrl = `${CONFIG.apiBaseUrl}${CONFIG.googleAuthPath}?remember=${remember}&redirect_uri=${redirectUri}`;
        window.location.href = googleUrl;
      });
    };

    emailInput.addEventListener("blur", validateEmailField);
    passwordInput.addEventListener("blur", validatePasswordField);

    emailInput.addEventListener("input", () => clearFieldError(emailInput, emailError));
    passwordInput.addEventListener("input", () => clearFieldError(passwordInput, passwordError));

    togglePasswordBtn.addEventListener("click", () => {
      const isHidden = passwordInput.type === "password";
      passwordInput.type = isHidden ? "text" : "password";
      togglePasswordBtn.textContent = isHidden ? "Ocultar" : "Mostrar";
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const emailIsValid = validateEmailField();
      const passwordIsValid = validatePasswordField();
      if (!emailIsValid || !passwordIsValid) {
        showToast("Revise los datos ingresados en el formulario.", "warning");
        return;
      }

      setLoading(true);

      try {
        const result = await loginWithApi({
          email: emailInput.value.trim(),
          password: passwordInput.value,
          remember: rememberInput.checked
        });

        if (!result.ok) {
          if (result.reason === "network") {
            showToast("Error al conectar con el servidor. Verifique su conexión e intente de nuevo.", "error");
          } else if (result.reason === "userNotFound") {
            showToast(messages.userNotFound, "error");
            emailInput.classList.remove("valid");
            emailInput.focus();
          } else if (result.reason === "wrongPassword") {
            showToast(messages.wrongPassword, "error");
            passwordInput.classList.remove("valid");
            passwordInput.focus();
          } else {
            showToast("Ocurrió un error al autenticar. Intente nuevamente.", "error");
          }
          return;
        }

        onAuthSuccess("password", result.data || {}, rememberInput.checked);
      } catch (error) {
        showToast("Ocurrió un error inesperado al iniciar sesión.", "error");
      } finally {
        setLoading(false);
      }
    });

    window.addEventListener("load", () => {
      setupGoogleAuth();
      const params = new URLSearchParams(window.location.search);
      if (params.get("logout") === "1") {
        showToast("Sesión cerrada correctamente", "info");
        const url = new URL(window.location.href);
        url.searchParams.delete("logout");
        history.replaceState(null, "", url.pathname + url.search || window.location.pathname);
      }
    });
  </script>
</body>
</html>
