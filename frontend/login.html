<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGFIP | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #1a3a5c;
      --primary-light: #2D5F8A;
      --white: #FFFFFF;
      --gray-900: #1a1a2e;
      --gray-600: #5c5c5c;
      --gray-200: #e8ecf0;
      --gray-100: #f4f7f9;
      --error-bg: #ffe6ea;
      --error-border: #d93025;
      --success-border: #2e7d32;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: linear-gradient(145deg, var(--primary) 0%, #0d2a47 60%, var(--primary-light) 100%);
      color: var(--gray-900);
      padding: 20px;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.97);
      border-radius: 24px;
      padding: 40px 32px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      animation: cardIn 0.45s ease-out;
      backdrop-filter: blur(8px);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 8px;
    }

    .login-logo img {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }

    .login-title {
      text-align: center;
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.02em;
    }

    .login-subtitle {
      text-align: center;
      margin: 0 0 28px;
      font-size: 13px;
      color: var(--gray-600);
      line-height: 1.4;
    }

    .field-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-900);
    }

    .input-control {
      width: 100%;
      border: 1.5px solid var(--gray-200);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      color: var(--gray-900);
      outline: none;
      background: var(--gray-100);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      font-family: inherit;
    }

    .input-control:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 4px rgba(45, 95, 138, 0.12);
      background: var(--white);
    }

    .input-control.valid {
      border-color: var(--success-border);
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--primary-light);
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
    }

    .toggle-password:hover {
      background: rgba(45, 95, 138, 0.08);
    }

    .field-error {
      display: none;
      margin-top: 6px;
      padding: 8px 10px;
      background: var(--error-bg);
      border-left: 4px solid var(--error-border);
      border-radius: 8px;
      color: #7a1f18;
      font-size: 12px;
    }

    .row-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0 20px;
      font-size: 14px;
    }

    .remember-session {
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
      font-size: 13px;
      color: var(--gray-600);
      cursor: pointer;
    }

    .remember-session input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary-light);
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: var(--white);
      font-size: 15px;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: filter 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
      box-shadow: 0 4px 14px rgba(26, 58, 92, 0.3);
      font-family: inherit;
    }

    .submit-btn:hover:not(:disabled) {
      filter: brightness(1.08);
      box-shadow: 0 6px 20px rgba(26, 58, 92, 0.4);
      transform: translateY(-1px);
    }

    .submit-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.4);
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .submit-btn.loading .spinner { display: inline-block; }
    .submit-btn.loading .btn-text { opacity: 0.9; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--gray-600);
    }

    .login-footer a {
      color: var(--primary-light);
      font-weight: 600;
      text-decoration: none;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <img src="images/logo.jpg" alt="IGSS" />
    </div>
    <h1 class="login-title">SGFIP</h1>
    <p class="login-subtitle">
      Delegación Retalhuleu<br />
      Sistema de Gestión de Flujo de Informes Patronales
    </p>

    <form id="loginForm" novalidate>
      <div class="field-group">
        <label for="email">Correo electrónico</label>
        <input
          class="input-control"
          id="email"
          name="email"
          type="email"
          placeholder="nombre@igss.gob.gt"
          autocomplete="username"
        />
        <div class="field-error" id="emailError"></div>
      </div>

      <div class="field-group">
        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input
            class="input-control"
            id="password"
            name="password"
            type="password"
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
          />
          <button class="toggle-password" type="button" id="togglePassword" aria-label="Mostrar u ocultar contraseña">
            Mostrar
          </button>
        </div>
        <div class="field-error" id="passwordError"></div>
      </div>

      <div class="row-actions">
        <label class="remember-session" for="remember">
          <input type="checkbox" id="remember" name="remember" />
          <span>Recordar sesión</span>
        </label>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-text">Ingresar</span>
      </button>



      <div class="login-footer">
        ¿No tiene cuenta? <a href="register.html">Crear cuenta</a>
      </div>
    </form>
  </div>

  <script src="js/toast.js"></script>
  <script src="js/config.js"></script>
  <script>
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const rememberInput = document.getElementById("remember");
    const emailError = document.getElementById("emailError");
    const passwordError = document.getElementById("passwordError");
    const submitBtn = document.getElementById("submitBtn");
    const togglePasswordBtn = document.getElementById("togglePassword");
    const CONFIG = SGFIP_CONFIG;

    const messages = {
      required: "El campo es obligatorio.",
      invalidEmail: "Formato de correo inválido. Ej: nombre@igss.gob.gt",
      userNotFound: "Usuario no encontrado. Verifique el correo electrónico ingresado.",
      wrongPassword: "Contraseña incorrecta. Intente nuevamente o contacte al administrador."
    };

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

    const clearFieldError = (input, errorBox) => {
      errorBox.style.display = "none";
      errorBox.textContent = "";
      input.classList.remove("valid");
    };

    const showFieldError = (input, errorBox, message) => {
      errorBox.style.display = "block";
      errorBox.textContent = message;
      input.classList.remove("valid");
    };

    const markValid = (input, errorBox) => {
      errorBox.style.display = "none";
      errorBox.textContent = "";
      input.classList.add("valid");
    };

    const validateEmailField = () => {
      const email = emailInput.value.trim();
      if (!email) {
        showFieldError(emailInput, emailError, messages.required);
        return false;
      }
      if (!emailRegex.test(email)) {
        showFieldError(emailInput, emailError, messages.invalidEmail);
        return false;
      }
      markValid(emailInput, emailError);
      return true;
    };

    const validatePasswordField = () => {
      const password = passwordInput.value;
      if (!password) {
        showFieldError(passwordInput, passwordError, messages.required);
        return false;
      }
      markValid(passwordInput, passwordError);
      return true;
    };

    const setLoading = (isLoading) => {
      submitBtn.disabled = isLoading;
      submitBtn.classList.toggle("loading", isLoading);
      submitBtn.querySelector(".btn-text").textContent = isLoading ? "Validando..." : "Ingresar";
    };

    const normalizeApiResult = async (response) => {
      let payload = {};
      try {
        payload = await response.json();
      } catch (error) {
        payload = {};
      }

      if (response.ok) {
        return { ok: true, data: payload };
      }

      const backendCode = payload.code || payload.error;
      if (response.status === 404 || backendCode === "USER_NOT_FOUND") {
        return { ok: false, reason: "userNotFound" };
      }

      if (response.status === 401 || backendCode === "INVALID_PASSWORD") {
        return { ok: false, reason: "wrongPassword" };
      }

      return { ok: false, reason: "generic" };
    };

    const loginWithApi = async ({ email, password, remember }) => {
      const loginUrl = `${CONFIG.apiBaseUrl}${CONFIG.apiLoginPath}`;
      try {
        const response = await fetch(loginUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        return normalizeApiResult(response);
      } catch {
        return { ok: false, reason: "network" };
      }
    };

    const saveSession = (data, remember) => {
      const storage = remember ? localStorage : sessionStorage;
      storage.setItem("sgfip_session", JSON.stringify(data));
    };

    const flattenSession = (data) => {
      const user = data.user || {};
      return {
        ...data,
        accessToken: data.accessToken || data.token,
        token: data.accessToken || data.token,
        userName: user.nombre || user.name || data.userName,
        email: user.email || data.email,
        role: user.rolId === 1 ? 'admin' : user.rolId === 2 ? 'inspector' : user.rolId === 3 ? 'supervisor' : data.role,
      };
    };

    const onAuthSuccess = (provider, data, remember) => {
      saveSession(
        {
          provider,
          loginAt: new Date().toISOString(),
          ...flattenSession(data),
        },
        remember
      );
      showToast("Sesión iniciada con éxito", "success", { duration: 2000 });
      setTimeout(() => {
        window.location.href = "app.html";
      }, 1600);
    };

    emailInput.addEventListener("blur", validateEmailField);
    passwordInput.addEventListener("blur", validatePasswordField);

    emailInput.addEventListener("input", () => clearFieldError(emailInput, emailError));
    passwordInput.addEventListener("input", () => clearFieldError(passwordInput, passwordError));

    togglePasswordBtn.addEventListener("click", () => {
      const isHidden = passwordInput.type === "password";
      passwordInput.type = isHidden ? "text" : "password";
      togglePasswordBtn.textContent = isHidden ? "Ocultar" : "Mostrar";
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const emailIsValid = validateEmailField();
      const passwordIsValid = validatePasswordField();
      if (!emailIsValid || !passwordIsValid) {
        showToast("Revise los datos ingresados en el formulario.", "warning");
        return;
      }

      setLoading(true);

      try {
        const result = await loginWithApi({
          email: emailInput.value.trim(),
          password: passwordInput.value,
          remember: rememberInput.checked
        });

        if (!result.ok) {
          if (result.reason === "network") {
            showToast("Error al conectar con el servidor. Verifique su conexión e intente de nuevo.", "error");
          } else if (result.reason === "userNotFound") {
            showToast(messages.userNotFound, "error");
            emailInput.classList.remove("valid");
            emailInput.focus();
          } else if (result.reason === "wrongPassword") {
            showToast(messages.wrongPassword, "error");
            passwordInput.classList.remove("valid");
            passwordInput.focus();
          } else {
            showToast("Ocurrió un error al autenticar. Intente nuevamente.", "error");
          }
          return;
        }

        onAuthSuccess("password", result.data || {}, rememberInput.checked);
      } catch (error) {
        showToast("Ocurrió un error inesperado al iniciar sesión.", "error");
      } finally {
        setLoading(false);
      }
    });

    window.addEventListener("load", () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get("logout") === "1") {
        showToast("Sesión cerrada correctamente", "info");
        const url = new URL(window.location.href);
        url.searchParams.delete("logout");
        history.replaceState(null, "", url.pathname + url.search || window.location.pathname);
      }
    });
  </script>
</body>
</html>
